name: Signalement de bug
description: Quelque chose ne fonctionne pas comme prévu.
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Quel est le problème ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: "Navigateur, système d'exploitation, branche ou commit"
